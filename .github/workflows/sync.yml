# Syncs new YouTube uploads into configured playlists on a schedule.
#
# Two jobs share this workflow:
#   build — runs on every push to master, compiles the binary, and caches it
#           keyed on the Go source hash so scheduled runs don't recompile.
#   sync  — runs on the 30-minute schedule (and manual dispatch), restores the
#           cached binary, and runs it directly. On a cold/evicted cache it
#           falls back to compiling, so sync never blocks on a missing binary.
#
# One-time setup (local):
#   1. Run the binary once to complete the OAuth consent flow, producing a
#      token.json that contains a long-lived refresh token.
#   2. Add two repository secrets (Settings → Secrets and variables → Actions):
#        CLIENT_SECRETS_JSON — full contents of client_secrets.json
#        TOKEN_JSON          — full contents of token.json
#   3. Commit config.yaml with your channel→playlist pairs (added via
#      --add-channel/--add-playlist). It carries no secrets and is tracked.
#
# state.json (the last-seen watermark per channel) is committed back to this
# branch after each sync run, so the syncer advances its cursor instead of
# re-seeding — without it every run would see every channel as new and add
# nothing. token.json is NOT persisted to git: the refresh token in the secret
# is long-lived and reused each run; an expired access token is refreshed
# in-process by the youtube package.
name: Sync YouTube playlists

on:
  push:
    branches: [master]
    # Build only when something that affects the compiled binary changes. The
    # sync job commits state.json back to master after every run; without this
    # filter each state-only commit would rebuild an identical binary. (Those
    # commits push via GITHUB_TOKEN, whose pushes already don't trigger
    # workflows — this filter makes the intent explicit and survives a later
    # switch to a PAT/App token.) schedule and workflow_dispatch are unaffected.
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/sync.yml'
  schedule:
    - cron: '7,37 * * * *' # every 30 minutes, at :07 & :37 past the hour UTC
  workflow_dispatch: {} # manual "Run workflow" button

# The default GITHUB_TOKEN must be allowed to push the state.json commit.
permissions:
  contents: write

jobs:
  # Compiles the binary on every commit and caches it under a key derived from
  # the Go sources. The sync job restores this exact key; a source change yields
  # a new key, so sync can never run a stale binary from older code.
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

      - name: Build
        run: make build

      # save fails if the key already exists (e.g. re-running the workflow on an
      # unchanged commit); that's harmless since the cached binary is identical.
      - name: Cache binary
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: youtube-updater
          key: yt-binary-${{ runner.os }}-${{ hashFiles('**/*.go', 'go.mod', 'go.sum') }}

  # Runs the cached binary. No Go toolchain or compile on the warm-cache path;
  # only a cold cache (first run, eviction) pays the compile cost.
  sync:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Queue runs instead of racing on the shared state.json. A scheduled run while
    # one is in flight waits; manual dispatch likewise. (Build has no group: it
    # never touches state.json, so it need not wait on a sync.)
    concurrency:
      group: youtube-sync
      cancel-in-progress: false
    steps:
      # Full history so the `git pull --rebase` in the commit step is reliable if
      # master advanced between checkout and push.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore cached binary
        id: bin
        uses: actions/cache/restore@v4
        with:
          path: youtube-updater
          key: yt-binary-${{ runner.os }}-${{ hashFiles('**/*.go', 'go.mod', 'go.sum') }}
          fail-on-cache-miss: false

      # Cold-cache fallback: compile locally so a missing/evicted cache can never
      # block a scheduled sync. Skipped entirely on a cache hit (no Go needed).
      - name: Set up Go (cache miss)
        if: steps.bin.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: true
      - name: Build (cache miss)
        if: steps.bin.outputs.cache-hit != 'true'
        run: make build

      - name: Write OAuth credentials
        run: |
          printf '%s' "$CLIENT_SECRETS_JSON" > client_secrets.json
          printf '%s' "$TOKEN_JSON" > token.json
          test -s client_secrets.json || { echo "CLIENT_SECRETS_JSON secret is empty or unset"; exit 1; }
          test -s token.json || { echo "TOKEN_JSON secret is empty or unset"; exit 1; }
        env:
          CLIENT_SECRETS_JSON: ${{ secrets.CLIENT_SECRETS_JSON }}
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}

      # Runs the prebuilt binary from repo root so it finds config.yaml,
      # client_secrets.json, token.json, and state.json via their default
      # relative paths.
      - name: Sync
        run: |
          chmod +x youtube-updater
          ./youtube-updater

      # Commit the advanced watermark back to master so the next run continues
      # from it. No-op when state.json is unchanged (sync that added nothing, a
      # crashed run where Save() never ran, or no new videos). `git pull --rebase`
      # handles the rare case of a human push landing mid-run; concurrency already
      # serializes CI-vs-CI runs. GITHUB_TOKEN pushes don't trigger workflows, so
      # this commit can't re-trigger the sync.
      - name: Commit & push updated state
        if: always()
        run: |
          git add state.json
          if git diff --cached --quiet; then
            echo "state.json unchanged; nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(ci): advance sync state"
          git pull --rebase origin master
          git push origin master
